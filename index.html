<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>ブリーレフ練習ツール</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4d4d4d;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  #topBar {
    position: fixed;
    left: env(safe-area-inset-left, 0px);
    right: env(safe-area-inset-right, 0px);
    top: env(safe-area-inset-top, 0px);
    height: 58px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 20;
    pointer-events: none;
  }
  #topBar button, #topBar .pill { pointer-events: auto; }
  button {
    border: 1px solid rgba(255,255,255,.28);
    background: rgba(0,0,0,.58);
    color: #fff;
    border-radius: 12px;
    padding: 10px 12px;
    font-weight: 700;
    touch-action: manipulation;
  }
  button.active { background: rgba(50,140,70,.95); }
  .pill {
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 13px;
    white-space: nowrap;
  }
  #hud {
    position: fixed;
    left: max(12px, env(safe-area-inset-left, 0px));
    top: calc(env(safe-area-inset-top, 0px) + 70px);
    z-index: 15;
    pointer-events: none;
    display: grid;
    gap: 6px;
  }
  .hudLine {
    width: fit-content;
    background: rgba(0,0,0,.52);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px;
    padding: 7px 10px;
    font-size: 13px;
    text-shadow: 0 1px 3px rgba(0,0,0,.65);
  }
  #panel {
    position: fixed;
    z-index: 30;
    left: max(10px, env(safe-area-inset-left, 0px));
    right: max(10px, env(safe-area-inset-right, 0px));
    bottom: max(10px, env(safe-area-inset-bottom, 0px));
    max-height: min(76vh, 660px);
    overflow: auto;
    background: rgba(22,22,22,.95);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 8px 35px rgba(0,0,0,.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transform: translateY(calc(100% + 24px));
    transition: transform .22s ease;
    touch-action: pan-y;
  }
  #panel.open { transform: translateY(0); }
  h1 { margin: 0 0 12px; font-size: 18px; }
  .modeButtons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .row { font-size: 13px; }
  label { display:block; margin-bottom: 4px; color: #ddd; }
  input[type="range"], select { width: 100%; height: 32px; }
  select { background:#222; color:#fff; border:1px solid #777; border-radius:8px; padding:4px 8px; }
  .value { color:#fff; font-weight:700; }
  .modeOnly { display: none; }
  body.mode-pizza .pizzaOnly { display: block; }
  body.mode-laser .laserOnly { display: block; }
  .checkRow { display:flex; align-items:center; gap:10px; margin-top: 12px; font-size: 14px; }
  .checkRow input { width: 22px; height: 22px; }
  .panelButtons { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .info { margin-top:12px; line-height:1.55; font-size:12px; color:#ddd; }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    #panel { max-height: 76vh; }
    button { padding: 9px 10px; }
    .pill { font-size: 12px; padding: 7px 9px; }
  }
</style>
</head>
<body class="mode-laser">
<canvas id="c"></canvas>

<div id="topBar">
  <button id="settingsBtn">設定</button>
  <button id="restartTop">リセット</button>
  <button id="topLaser" class="active">2層50%</button>
  <button id="topPizza">1層ピザ</button>
  <div class="pill" id="statePill">待機中</div>
</div>

<div id="hud">
  <div class="hudLine" id="hud1">経過: 0.00秒</div>
  <div class="hudLine" id="hud2">クリア時間: 0.00秒</div>
  <div class="hudLine" id="hud3">成功: 0</div>
  <div class="hudLine" id="hud4">タッチで開始</div>
</div>

<div id="panel">
  <h1>ブリーレフ練習ツール</h1>

  <div class="modeButtons">
    <button id="modeLaser" class="active">2層50%</button>
    <button id="modePizza">1層ピザ</button>
  </div>

  <div class="grid">
    <div class="row">
      <label>移動速度: <span id="vSpeed" class="value">280</span></label>
      <input id="speed" type="range" min="100" max="600" step="10" value="280">
    </div>
    <div class="row">
      <label>●の当たり判定倍率: <span id="vHitScale" class="value">1.0</span> 倍</label>
      <input id="hitScale" type="range" min="1" max="10" step="0.1" value="1">
    </div>

    <div class="row modeOnly laserOnly">
      <label>レーザー幅: <span id="vWidth" class="value">200</span></label>
      <input id="laserWidth" type="range" min="50" max="320" step="10" value="200">
    </div>
    <div class="row modeOnly laserOnly">
      <label>3分割ランダム発生率: <span id="vRandomLane" class="value">15</span>%</label>
      <input id="randomLaneRate" type="range" min="0" max="100" step="1" value="15">
    </div>
    <div class="row modeOnly laserOnly">
      <label>レーザー予告時間: <span id="vFade" class="value">1.5</span> 秒</label>
      <input id="fade" type="range" min="0.3" max="2.0" step="0.1" value="1.5">
    </div>
    <div class="row modeOnly laserOnly">
      <label>レーザー間隔 初期値: <span id="vInitial" class="value">1.5</span> 秒</label>
      <input id="initialInterval" type="range" min="0.3" max="3.0" step="0.1" value="1.5">
    </div>
    <div class="row modeOnly laserOnly">
      <label>加速量: <span id="vDecrease" class="value">0.090</span></label>
      <input id="intervalDecrease" type="range" min="0.000" max="0.200" step="0.005" value="0.090">
    </div>
    <div class="row modeOnly laserOnly">
      <label>最短レーザー間隔: <span id="vMin" class="value">0.25</span> 秒</label>
      <input id="minInterval" type="range" min="0.10" max="1.00" step="0.05" value="0.25">
    </div>
    <div class="row modeOnly laserOnly">
      <label>景色変化時間: <span id="vIntro" class="value">3.5</span> 秒</label>
      <input id="introDuration" type="range" min="2.0" max="5.0" step="0.1" value="3.5">
    </div>
    <div class="row modeOnly laserOnly">
      <label>〇が出た後から1本目まで: <span id="vDelay" class="value">3.5</span> 秒</label>
      <input id="startDelay" type="range" min="0.0" max="5.0" step="0.1" value="3.5">
    </div>
    <div class="row modeOnly laserOnly">
      <label>クリアに必要な時間: <span id="vClearTime" class="value">7.5</span> 秒</label>
      <input id="clearTime" type="range" min="7.5" max="30" step="0.5" value="7.5">
    </div>
    <div class="row modeOnly laserOnly">
      <label>4本目までの時間: <span id="vFourthTime" class="value">6.0</span> 秒</label>
      <input id="fourthTime" type="range" min="3" max="7" step="0.1" value="6">
    </div>

    <div class="row modeOnly pizzaOnly">
      <label>ピザパターン</label>
      <select id="pizzaPattern">
        <option value="55">55% / 10回</option>
        <option value="15">15% / 10回</option>
      </select>
    </div>
    <div class="row modeOnly pizzaOnly">
      <label>ピザ予告時間: <span id="vPizzaWarn" class="value">1.5</span> 秒</label>
      <input id="pizzaWarn" type="range" min="0.5" max="3.0" step="0.1" value="1.5">
    </div>
    <div class="row modeOnly pizzaOnly">
      <label>次の攻撃まで: <span id="vPizzaGap" class="value">0.3</span> 秒</label>
      <input id="pizzaGap" type="range" min="0.1" max="3.0" step="0.1" value="0.3">
    </div>
    <div class="row modeOnly pizzaOnly">
      <label>ギミック開始・移動猶予: <span id="vPizzaStartDelay" class="value">3.0</span> 秒</label>
      <input id="pizzaStartDelay" type="range" min="0" max="5" step="0.1" value="3">
    </div>
  </div>

  <label class="checkRow"><input id="invincible" type="checkbox">無敵モード</label>
  <label class="checkRow"><input id="gridLaserMode" type="checkbox">3×3グリッドレーザー</label>
  <label class="checkRow modeOnly pizzaOnly"><input id="showTankMarker" type="checkbox">タンク位置マーカー表示</label>

  <div class="panelButtons">
    <button id="restart">リセット</button>
    <button id="closePanel">閉じる</button>
  </div>

  <div class="info modeOnly pizzaOnly">
    1層ピザ：円を8等分。赤丸はタンクが行くべき位置です。●=タンクの位置によってピザ全体が回転し、12時方向の判定点が白エリアに入れば成功です。タンク自身は緑範囲にいても失敗しません。10回目は無敵化し、全エリア緑範囲になります。
  </div>
  <div class="info modeOnly laserOnly">
    2層50%：ドラッグで移動。レーザーは基本●基準で縦/横ランダム。3×3グリッドレーザーON時は、円の外接正方形を3×3分割し、現在●がいる行/列へレーザーが飛びます。
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const panel = document.getElementById('panel');
  const statePill = document.getElementById('statePill');
  const hud1 = document.getElementById('hud1');
  const hud2 = document.getElementById('hud2');
  const hud3 = document.getElementById('hud3');
  const hud4 = document.getElementById('hud4');
  const world = { centerX: 0, centerY: 0, radius: 300 };
  const player = { x: 0, y: 0 };
  let moveTarget = null;
  const keys = new Set();

  const cfg = {
    zoom: 1.0,
    mode: 'laser',
    invincible: false,
    showTankMarker: false,
    gridLaserMode: false,
    background: [77,77,77],
    playerSize: 30,
    hitScale: 1.0,
    playerSpeed: 280,
    zoom: 1.0,
    laserWidth: 200,
    randomLaneRate: 15,
    laserFadeDuration: 1.5,
    damageDuration: 0.08,
    initialLaserInterval: 1.5,
    intervalDecrease: 0.090,
    minLaserInterval: 0.25,
    startDelay: 3.5,
    introDuration: 3.5,
    fourthTime: 6.0,
    damageMaxAlpha: 150,
    clearTime: 7.5,
    pizzaWarn: 1.5,
    pizzaGap: 0.3,
    pizzaStartDelay: 3.0,
  };

  const SECTOR_LABELS = [12, 1, 3, 5, 6, 7, 9, 11];
  // 画像の白い安全地帯パターンを固定定義
  // sector index:
  // 0=12時,1=1時,2=3時,3=5時,4=6時,5=7時,6=9時,7=11時

  const PIZZA_55 = [
    // 画像ベースの55%固定パターン
    // sector index:
    // 0=12時, 1=1時, 2=3時, 3=5時, 4=6時, 5=7時, 6=9時, 7=11時
    // tank = 赤丸位置 / safe = 白エリア
    { tank:6,  safe:[0,2,4,6] },
    { tank:6,  safe:[7,0,1] },
    { tank:9,  safe:[0,4] },
    { tank:12, safe:[0] },
    { tank:3,  safe:[0] },
    { tank:6,  safe:[0] },
    { tank:9,  safe:[0] },
    { tank:11, safe:[0] },
    { tank:12, safe:[0] },
    { tank:12, safe:[0] },
  ];

  const PIZZA_15 = [
    { tank:12, safe:[0] },
    { tank:5,  safe:[0] },
    { tank:7,  safe:[0] },
    { tank:12, safe:[0] },
    { tank:6,  safe:[0] },
    { tank:1,  safe:[0] },
    { tank:12, safe:[0] },
    { tank:6,  safe:[0] },
    { tank:9,  safe:[0] },
    { tank:12, safe:[0] },
  ];

  const lasers = [];
  let state = 'waiting';
  let introStartTime = 0;
  let circleStartTime = 0;
  let gameTimer = 0;
  let clearTimer = 0;
  let introTimer = 0;
  let lastLaserTime = 0;
  let laserCount = 0;
  let successCount = 0;
  let lastAxis = null;
  let last = performance.now();
  let isDragging = false;

  const pizza = {
    index: 0,
    timer: 0,
    phase: 'startWait',
    // 赤丸＝タンクが行くべき位置
    targetHour: 6,
    resolved: false,
    frozenSafe: [],
    success: 0,
    fail: 0,
  };

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    world.centerX = window.innerWidth / 2;
    world.centerY = window.innerHeight / 2 + 20;
    world.radius = Math.max(230, Math.min(320, Math.min(window.innerWidth, window.innerHeight) * 0.34));
    if (state === 'waiting') setStartPosition();
  }

  function setStartPosition() {
    player.x = world.centerX;
    player.y = world.centerY - world.radius - 80;
  }

  function setMode(mode) {
    cfg.mode = mode;
    document.body.classList.toggle('mode-laser', mode === 'laser');
    document.body.classList.toggle('mode-pizza', mode === 'pizza');
    for (const id of ['modeLaser','topLaser']) document.getElementById(id).classList.toggle('active', mode === 'laser');
    for (const id of ['modePizza','topPizza']) document.getElementById(id).classList.toggle('active', mode === 'pizza');
    reset();
  }

  function reset() {
    state = 'waiting';
    lasers.length = 0;
    laserCount = 0;
    successCount = 0;
    gameTimer = 0;
    clearTimer = 0;
    introTimer = 0;
    lastLaserTime = 0;
    lastAxis = null;
    moveTarget = null;
    isDragging = false;
    pizza.index = 0;
    pizza.timer = 0;
    pizza.phase = 'startWait';
    pizza.resolved = false;
    pizza.frozenSafe = [];
    pizza.success = 0;
    pizza.fail = 0;
    choosePizzaSafe();
    setStartPosition();
  }

  function begin() {
    panel.classList.remove('open');
    if (cfg.mode === 'laser') {
      state = 'intro';
      introStartTime = performance.now() / 1000;
      gameTimer = 0;
      clearTimer = 0;
      lasers.length = 0;
      laserCount = 0;
      successCount = 0;
      setStartPosition();
    } else {
      state = 'pizzaActive';
      circleStartTime = performance.now() / 1000;
      gameTimer = 0;
      pizza.index = 0;
      pizza.timer = 0;
      pizza.phase = 'startWait';
      pizza.success = 0;
      pizza.fail = 0;
      choosePizzaSafe();
      setStartPosition();
    }
  }

  function isInCircle(x, y) { return Math.hypot(x - world.centerX, y - world.centerY) <= world.radius; }
  function screenToWorld(sx, sy) { return { x: player.x + (sx - window.innerWidth / 2) / cfg.zoom, y: player.y + (sy - window.innerHeight / 2) / cfg.zoom }; }
  function worldToScreen(x, y) {
    return {
      x: window.innerWidth / 2 + (x - player.x) * cfg.zoom,
      y: window.innerHeight / 2 + (y - player.y) * cfg.zoom
    };
  }

  function zoomValue(v) {
    return v * cfg.zoom;
  }

  function sectorIndexFromHour(hour) {
    const idx = SECTOR_LABELS.indexOf(hour);
    return idx >= 0 ? idx : 0;
  }
  function sectorCenterAngle(index) { return -Math.PI / 2 + index * (Math.PI * 2 / 8); }
  function sectorStartAngle(index) { return sectorCenterAngle(index) - Math.PI / 8; }
  function playerSector() {
    const a = Math.atan2(player.y - world.centerY, player.x - world.centerX);
    const n = (a + Math.PI / 2 + Math.PI * 2 + Math.PI / 8) % (Math.PI * 2);
    return Math.floor(n / (Math.PI * 2 / 8)) % 8;
  }
  function getPizzaSeq() {
    return document.getElementById('pizzaPattern').value === '55' ? PIZZA_55 : PIZZA_15;
  }
  function choosePizzaSafe() {
    const seq = getPizzaSeq();
    const p = seq[pizza.index % seq.length];
    pizza.targetHour = p.tank;
    // 画像通りの基準白エリア。ここからタンク位置に応じて回転する。
    pizza.fixedSafe = p.safe.slice();
    pizza.resolved = false;
    pizza.frozenSafe = [];
  }

  function dynamicPizzaSafeSectors() {
    const base = pizza.fixedSafe || [0];
    const baseTankSec = sectorIndexFromHour(pizza.targetHour);
    const currentTankSec = isInCircle(player.x, player.y) ? playerSector() : baseTankSec;
    const rotate = (currentTankSec - baseTankSec + 8) % 8;
    return base.map(sec => (sec + rotate) % 8);
  }

  function currentPizzaSafeSectors() {
    // 10回目は全エリア緑範囲にする
    if (pizza.index >= 9) return [];

    // 予兆発生後は安全地帯を固定する。
    if (pizza.phase === 'warn' && pizza.frozenSafe && pizza.frozenSafe.length) {
      return pizza.frozenSafe;
    }
    return dynamicPizzaSafeSectors();
  }

  function isPizzaSafe(sec) {
    return currentPizzaSafeSectors().includes(sec);
  }

  function isTwelveSafe() {
    // タンク以外が待機する12時方向の判定。
    return currentPizzaSafeSectors().includes(0);
  }

  function currentLaserInterval() {
    if (laserCount > 0 && laserCount < 4) return Math.max(0.05, (cfg.fourthTime - cfg.startDelay) / 3.0);
    const byCount = Math.max(0, laserCount - 4) * cfg.intervalDecrease;
    const byTime = Math.max(0, gameTimer - cfg.fourthTime) * cfg.intervalDecrease * 0.42;
    return Math.max(cfg.minLaserInterval, cfg.initialLaserInterval - byCount - byTime);
  }
  function chooseAxis() {
    let axis = Math.random() < 0.5 ? 'row' : 'column';
    if (lastAxis && Math.random() < 0.18) axis = lastAxis === 'row' ? 'column' : 'row';
    lastAxis = axis;
    return axis;
  }
  function getPlayerGridCell() {
    // 円の外接正方形を3×3に分割し、現在●がいるエリアを求める
    const left = world.centerX - world.radius;
    const top = world.centerY - world.radius;
    const cell = (world.radius * 2) / 3;

    let col = Math.floor((player.x - left) / cell);
    let row = Math.floor((player.y - top) / cell);

    col = Math.max(0, Math.min(2, col));
    row = Math.max(0, Math.min(2, row));

    return { row, col, cell, left, top };
  }

  function addLaser(axis) {
    let center;
    let width;

    if (cfg.gridLaserMode) {
      const grid = getPlayerGridCell();

      // 3×3グリッド基準
      if (axis === 'column') {
        center = grid.left + grid.cell * (grid.col + 0.5);
      } else {
        center = grid.top + grid.cell * (grid.row + 0.5);
      }

      width = grid.cell;

    } else {
      // 従来の●座標ぴったり基準
      center = axis === 'column' ? player.x : player.y;
      width = cfg.laserWidth;
    }

    lasers.push({
      axis,
      segmentStart: center - width / 2,
      segmentEnd: center + width / 2,
      time: 0,
      alpha: 0,
      reachedFull: false,
      resolved: false
    });
  }
  function spawnLaser(now) { addLaser(chooseAxis()); laserCount++; lastLaserTime = now; }
  function hitLaser(l) {
    const r = cfg.playerSize * cfg.hitScale;
    return l.axis === 'row' ? (player.y + r >= l.segmentStart && player.y - r <= l.segmentEnd) : (player.x + r >= l.segmentStart && player.x - r <= l.segmentEnd);
  }
  function resolveLaser(l) {
    if (l.resolved) return;
    l.resolved = true;
    if (hitLaser(l)) { if (!cfg.invincible && state !== 'win') state = 'dead'; }
    else successCount++;
  }
  function updateLasers(dt) {
    for (let i = lasers.length - 1; i >= 0; i--) {
      const l = lasers[i];
      l.time += dt;
      if (l.time < cfg.laserFadeDuration) l.alpha = cfg.damageMaxAlpha * (l.time / cfg.laserFadeDuration);
      else { l.alpha = cfg.damageMaxAlpha; if (!l.reachedFull) { l.reachedFull = true; resolveLaser(l); } }
      if (l.time >= cfg.laserFadeDuration + cfg.damageDuration) lasers.splice(i, 1);
    }
  }

  function movePlayer(dt) {
    let dx = 0, dy = 0;
    if (keys.has('w') || keys.has('arrowup')) dy -= 1;
    if (keys.has('s') || keys.has('arrowdown')) dy += 1;
    if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
    if (keys.has('d') || keys.has('arrowright')) dx += 1;
    if (dx || dy) moveTarget = null;
    const m = Math.hypot(dx, dy);
    if (m > 0) { player.x += dx / m * cfg.playerSpeed * dt; player.y += dy / m * cfg.playerSpeed * dt; return; }
    if (moveTarget) {
      const tx = moveTarget.x - player.x, ty = moveTarget.y - player.y;
      const d = Math.hypot(tx, ty), step = cfg.playerSpeed * dt;
      if (d <= step) { player.x = moveTarget.x; player.y = moveTarget.y; moveTarget = null; }
      else { player.x += tx / d * step; player.y += ty / d * step; }
    }
  }

  function updateLaserMode(dt, now) {
    if (state === 'intro') {
      introTimer = now - introStartTime;
      movePlayer(dt);
      if (introTimer >= cfg.introDuration) { state = 'active'; circleStartTime = now; lastLaserTime = now; gameTimer = 0; }
      return;
    }
    if (state !== 'active' && state !== 'win') return;
    gameTimer = now - circleStartTime;
    movePlayer(dt);
    if ((state === 'active' || state === 'win') && isInCircle(player.x, player.y)) clearTimer += dt;
    if (now - lastLaserTime >= currentLaserInterval() && now - circleStartTime >= cfg.startDelay) spawnLaser(now);
    updateLasers(dt);
    if (clearTimer >= cfg.clearTime && state !== 'dead' && state !== 'win') state = 'win';
    if (gameTimer >= 30 && state !== 'dead') state = 'finished';
  }

  function updatePizzaMode(dt, now) {
    if (state !== 'pizzaActive' && state !== 'pizzaWin') return;
    gameTimer = now - circleStartTime;
    movePlayer(dt);
    pizza.timer += dt;
    if (pizza.phase === 'startWait') {
      if (pizza.timer >= cfg.pizzaStartDelay) {
        // 最初の開始猶予後、1回目の予兆を発生させる
        pizza.frozenSafe = dynamicPizzaSafeSectors().slice();
        pizza.timer = 0;
        pizza.phase = 'warn';
      }
      return;
    }
    if (pizza.phase === 'warn') {
      if (pizza.timer >= cfg.pizzaWarn && !pizza.resolved) {
        pizza.resolved = true;
        // 成功条件：タンク位置によって回転した結果、12時方向が安全になっていること。
        // タンク自身は緑範囲にいても失敗しない。
        const ok = pizza.index >= 9 || (isInCircle(player.x, player.y) && isTwelveSafe());
        if (ok || cfg.invincible) pizza.success++;
        else { pizza.fail++; state = 'dead'; return; }
      }
      if (pizza.timer >= cfg.pizzaWarn + cfg.pizzaGap) {
        pizza.index++;
        if (pizza.index >= 10) state = 'pizzaWin';
        else {
          // ギミック開始後は3秒待たず、次の予兆を即発生させる
          pizza.timer = 0;
          choosePizzaSafe();
          pizza.frozenSafe = dynamicPizzaSafeSectors().slice();
          pizza.phase = 'warn';
        }
      }
    }
  }
  function update(dt) {
    const now = performance.now() / 1000;
    cfg.mode === 'laser' ? updateLaserMode(dt, now) : updatePizzaMode(dt, now);
  }

  function drawGrid() {
    const spacing = 80;
    const startX = Math.floor((player.x - window.innerWidth / 2) / spacing) * spacing;
    const startY = Math.floor((player.y - window.innerHeight / 2) / spacing) * spacing;
    ctx.strokeStyle = state === 'waiting' ? 'rgba(0,0,0,.10)' : 'rgba(255,255,255,.10)';
    ctx.lineWidth = 1;
    for (let x = startX; x <= player.x + window.innerWidth / 2; x += spacing) { const a = worldToScreen(x, player.y - window.innerHeight), b = worldToScreen(x, player.y + window.innerHeight); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    for (let y = startY; y <= player.y + window.innerHeight / 2; y += spacing) { const a = worldToScreen(player.x - window.innerWidth, y), b = worldToScreen(player.x + window.innerWidth, y); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
  }
  function drawCircle() {
    if (cfg.mode === 'laser' && (state === 'waiting' || state === 'intro')) return;
    const c = worldToScreen(world.centerX, world.centerY);
    ctx.strokeStyle = 'rgb(100,100,100)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(c.x,c.y,zoomValue(world.radius),0,Math.PI*2); ctx.stroke();
  }
  function drawPizza() {
    if (cfg.mode !== 'pizza') return;
    // 最初の開始猶予中は緑/白の予兆を表示しない
    if (state === 'pizzaActive' && pizza.phase === 'startWait') return;

    const c = worldToScreen(world.centerX, world.centerY);
    const r = world.radius;
    const sector = Math.PI * 2 / 8;

    // 予兆は中心から外側へ広がる。
    // 端まで到達した時点が判定タイミング。
    const progress = pizza.phase === 'warn'
      ? Math.min(1, pizza.timer / cfg.pizzaWarn)
      : 1;

    const drawR = zoomValue(r * progress);

    for (let i = 0; i < 8; i++) {
      const start = sectorStartAngle(i), end = start + sector;
      const safe = isPizzaSafe(i);

      ctx.fillStyle = safe
        ? 'rgba(255,255,255,.85)'
        : 'rgba(178,226,199,.62)';

      ctx.beginPath();
      ctx.moveTo(c.x,c.y);
      ctx.arc(c.x,c.y,drawR,start,end);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(0,0,0,.75)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 外周円。予兆がここまで到達したら判定。
    ctx.strokeStyle = 'rgba(255,255,255,.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(c.x,c.y,zoomValue(r),0,Math.PI*2);
    ctx.stroke();

    if (cfg.showTankMarker) {
      const a = sectorCenterAngle(sectorIndexFromHour(pizza.targetHour));
      ctx.fillStyle = 'rgba(220,70,55,.95)';
      ctx.beginPath();
      ctx.arc(c.x + Math.cos(a)*zoomValue(r*.68), c.y + Math.sin(a)*zoomValue(r*.68), zoomValue(10), 0, Math.PI*2);
      ctx.fill();
    }

    ctx.fillStyle = 'white';
    ctx.font = `bold ${Math.max(10, zoomValue(14))}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let i = 0; i < 8; i++) {
      const aa = sectorCenterAngle(i);
      ctx.fillText(`${SECTOR_LABELS[i]}時`, c.x + Math.cos(aa)*zoomValue(r+24), c.y + Math.sin(aa)*zoomValue(r+24));
    }
  }
  function drawLasers() {
    if (cfg.mode !== 'laser') return;
    for (const l of lasers) {
      ctx.fillStyle = `rgba(255,0,0,${l.alpha/255})`;
      if (l.axis === 'row') { const p = worldToScreen(world.centerX-world.radius,l.segmentStart); ctx.fillRect(p.x,p.y,zoomValue(world.radius*2),zoomValue(cfg.laserWidth)); }
      else { const p = worldToScreen(l.segmentStart,world.centerY-world.radius); ctx.fillRect(p.x,p.y,zoomValue(cfg.laserWidth),zoomValue(world.radius*2)); }
    }
  }
  function drawTarget() {
    if (!moveTarget || ['active','intro','win','pizzaActive','pizzaWin'].indexOf(state) === -1) return;
    const p = worldToScreen(moveTarget.x, moveTarget.y);
    ctx.strokeStyle = 'rgba(255,210,120,.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x,p.y,8,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x-13,p.y); ctx.lineTo(p.x+13,p.y); ctx.moveTo(p.x,p.y-13); ctx.lineTo(p.x,p.y+13); ctx.stroke();
  }
  function drawPlayer() {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(window.innerWidth/2, window.innerHeight/2, zoomValue(cfg.playerSize), 0, Math.PI*2); ctx.fill();
    const r = zoomValue(cfg.playerSize * cfg.hitScale);
    if (cfg.hitScale > 1) { ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(window.innerWidth/2,window.innerHeight/2,r,0,Math.PI*2); ctx.stroke(); }
  }
  function drawText() {
    ctx.save(); ctx.shadowBlur = 5; ctx.shadowColor = 'black'; ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (state === 'waiting') { ctx.fillStyle='rgba(0,0,0,.65)'; ctx.fillRect(window.innerWidth/2-150,window.innerHeight/2-34,300,68); ctx.fillStyle='#fff'; ctx.font='bold 20px Arial'; ctx.fillText('タッチで開始',window.innerWidth/2,window.innerHeight/2); }
    else if (state === 'dead') { ctx.font='24px Arial'; ctx.fillText('失敗 - タッチでリセット',window.innerWidth/2,window.innerHeight/2); }
    else if (state === 'win') { ctx.font='24px Arial'; ctx.fillText('目覚めたオーラの壁が感じられる',window.innerWidth/2,window.innerHeight/2); }
    else if (state === 'finished') { ctx.font='24px Arial'; ctx.fillText('終了 - タッチでリセット',window.innerWidth/2,window.innerHeight/2); }
    else if (state === 'pizzaWin') { ctx.font='24px Arial'; ctx.fillText('ピザ練習クリア - タッチでリセット',window.innerWidth/2,window.innerHeight/2); }
    ctx.restore();
  }
  function bg() {
    if (state === 'waiting') return 'rgb(235,232,220)';
    if (cfg.mode === 'laser' && state === 'intro') {
      const p = Math.max(0, Math.min(1, introTimer/cfg.introDuration));
      const day=[125,165,185], sun=[150,85,55], night=cfg.background;
      const a=p<.55?day:sun, b=p<.55?sun:night, q=p<.55?p/.55:(p-.55)/.45;
      return `rgb(${Math.round(a[0]+(b[0]-a[0])*q)},${Math.round(a[1]+(b[1]-a[1])*q)},${Math.round(a[2]+(b[2]-a[2])*q)})`;
    }
    return `rgb(${cfg.background.join(',')})`;
  }
  function updateHud() {
    const st = {waiting:'待機中', intro:'景色変化中', active:'練習中', win:'クリア後継続中', dead:'失敗', finished:'終了', pizzaActive:'ピザ練習中', pizzaWin:'ピザクリア'}[state] || state;
    statePill.textContent = st;
    if (cfg.mode === 'pizza') {
      hud1.textContent = `ピザ: ${Math.min(pizza.index+1,10)} / 10`;
      hud2.textContent = `成功: ${pizza.success} / 失敗: ${pizza.fail}`;
      hud3.textContent = pizza.index >= 9
        ? `10回目: 無敵 / 全エリア緑範囲`
        : `基準赤丸: ${pizza.targetHour}時 / 12時: ${isTwelveSafe() ? '安全' : '危険'}`;
      if (state === 'waiting') hud4.textContent = 'タッチで開始';
      else if (pizza.phase === 'startWait') hud4.textContent = `開始まで: ${(cfg.pizzaStartDelay-pizza.timer).toFixed(1)}秒`;
      else if (pizza.phase === 'startWait') hud4.textContent = `開始まで: ${Math.max(0,cfg.pizzaStartDelay-pizza.timer).toFixed(1)}秒`;
      else hud4.textContent = `判定まで: ${Math.max(0,cfg.pizzaWarn-pizza.timer).toFixed(1)}秒`;
    } else {
      hud1.textContent = `経過: ${gameTimer.toFixed(2)}秒 / 30秒`;
      hud2.textContent = `クリア時間: ${clearTimer.toFixed(2)} / ${cfg.clearTime.toFixed(1)}秒`;
      hud3.textContent = `回避成功: ${successCount}`;
      if (state === 'waiting') hud4.textContent = 'タッチで開始';
      else if (state === 'intro') hud4.textContent = '〇出現前：移動可能';
      else if ((state === 'active' || state === 'win') && !isInCircle(player.x, player.y) && state !== 'win') hud4.textContent = '〇外：クリア時間停止中';
      else if (state === 'active' && gameTimer < cfg.startDelay) hud4.textContent = `1本目まで: ${(cfg.startDelay-gameTimer).toFixed(1)}秒`;
      else hud4.textContent = cfg.invincible ? '無敵モード中' : `レーザー間隔: ${currentLaserInterval().toFixed(2)}秒`;
    }
  }
  function draw() {
    ctx.fillStyle = bg(); ctx.fillRect(0,0,window.innerWidth,window.innerHeight);
    drawGrid();
    drawPizza();
    drawCircle();
    drawLasers();
    drawTarget();
    drawPlayer();
    drawText();
    updateHud();
  }
  function loop(now) { const dt = Math.min(.033,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(loop); }

  function bindSlider(id,key,label,dec=0){ const input=document.getElementById(id), span=document.getElementById(label); const sync=()=>{cfg[key]=Number(input.value); span.textContent=cfg[key].toFixed(dec);}; input.addEventListener('input',sync); sync(); }
  bindSlider('speed','playerSpeed','vSpeed',0); bindSlider('hitScale','hitScale','vHitScale',1);
  bindSlider('laserWidth','laserWidth','vWidth',0); bindSlider('randomLaneRate','randomLaneRate','vRandomLane',0); bindSlider('fade','laserFadeDuration','vFade',1); bindSlider('initialInterval','initialLaserInterval','vInitial',1); bindSlider('intervalDecrease','intervalDecrease','vDecrease',3); bindSlider('minInterval','minLaserInterval','vMin',2); bindSlider('introDuration','introDuration','vIntro',1); bindSlider('startDelay','startDelay','vDelay',1); bindSlider('clearTime','clearTime','vClearTime',1); bindSlider('fourthTime','fourthTime','vFourthTime',1);
  bindSlider('pizzaWarn','pizzaWarn','vPizzaWarn',1); bindSlider('pizzaGap','pizzaGap','vPizzaGap',1); bindSlider('pizzaStartDelay','pizzaStartDelay','vPizzaStartDelay',1);
  document.getElementById('invincible').addEventListener('change',e=>{cfg.invincible=e.target.checked;});
  document.getElementById('showTankMarker').addEventListener('change',e=>{cfg.showTankMarker=e.target.checked;});
  document.getElementById('gridLaserMode').addEventListener('change',e=>{cfg.gridLaserMode=e.target.checked;});
  document.getElementById('pizzaPattern').addEventListener('change',()=>reset());
  function isUiTarget(t){return t.closest&&(t.closest('#panel')||t.closest('#topBar'));}
  function pointerStart(x,y,target){ if(isUiTarget(target)) return; if(state==='waiting'){begin();return;} if(['dead','finished','pizzaWin'].includes(state)){reset();return;} isDragging=true; moveTarget=screenToWorld(x,y); }
  function pointerMove(x,y){ if(!isDragging)return; moveTarget=screenToWorld(x,y); }
  function pointerEnd(){ isDragging=false; }
  window.addEventListener('resize',resize); window.addEventListener('orientationchange',()=>setTimeout(resize,250));
  window.addEventListener('keydown',e=>{const k=e.key.toLowerCase(); if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){keys.add(k); e.preventDefault();}});
  window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
  window.addEventListener('mousedown',e=>pointerStart(e.clientX,e.clientY,e.target)); window.addEventListener('mousemove',e=>pointerMove(e.clientX,e.clientY)); window.addEventListener('mouseup',pointerEnd);
  window.addEventListener('touchstart',e=>{const t=e.touches[0]; if(!t)return; if(isUiTarget(e.target))return; pointerStart(t.clientX,t.clientY,e.target); e.preventDefault();},{passive:false});
  window.addEventListener('touchmove',e=>{if(!isDragging)return; const t=e.touches[0]; if(!t)return; pointerMove(t.clientX,t.clientY); e.preventDefault();},{passive:false});
  window.addEventListener('touchend',e=>{if(!isDragging)return; pointerEnd(); e.preventDefault();},{passive:false});

  // マウスホイールで全体ズーム
  window.addEventListener('wheel', e => {
    e.preventDefault();

    const zoomSpeed = 0.0015;

    cfg.zoom *= (1 - e.deltaY * zoomSpeed);

    cfg.zoom = Math.max(0.4, Math.min(2.5, cfg.zoom));
  }, { passive:false });
  document.getElementById('settingsBtn').addEventListener('click',()=>panel.classList.toggle('open'));
  document.getElementById('closePanel').addEventListener('click',()=>panel.classList.remove('open'));
  document.getElementById('restart').addEventListener('click',reset); document.getElementById('restartTop').addEventListener('click',reset);
  document.getElementById('modeLaser').addEventListener('click',()=>setMode('laser')); document.getElementById('topLaser').addEventListener('click',()=>setMode('laser'));
  document.getElementById('modePizza').addEventListener('click',()=>setMode('pizza')); document.getElementById('topPizza').addEventListener('click',()=>setMode('pizza'));
  let lastTouchEnd=0; document.addEventListener('touchend',e=>{const now=Date.now(); if(now-lastTouchEnd<=300)e.preventDefault(); lastTouchEnd=now;},{passive:false});
  setMode('laser'); resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
